<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>服务器管理面板</title>
<link rel="stylesheet" href="css/style.css">
<!-- ... (Font Awesome and Google Fonts links remain the same) ... -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
  <div class="sidebar">
    <div class="sidebar-header">
      <h3><i class="fas fa-server"></i> 管理面板</h3>
    </div>
    <button id="btnCreateServer" class="active"><i class="fas fa-plus-circle"></i> 创建服务器</button>
    <!-- 新增按钮 -->
    <button id="btnCreateWorld"><i class="fas fa-globe"></i> 创建世界</button>
    <button id="btnServerList"><i class="fas fa-list-ul"></i> 服务器列表</button>
  </div>
  <div class="content" id="contentArea">
    <!-- 视图内容将动态加载到这里 -->
  </div>
</div>

<!-- 加载脚本 -->
<script src="js/uploader.js"></script>
<!-- 现有视图 -->
<script src="js/views/InitialView.js"></script>
<script src="js/views/SelectModView.js"></script>
<script src="js/views/SelectWorldView.js"></script>
<script src="js/views/ServerSettingsView.js"></script>
<script src="js/views/ServerListView.js"></script>
<script src="js/views/ServerControlView.js"></script>
<!-- 新增的世界创建视图 -->
<script src="js/views/SelectWorldSizeView.js"></script>
<script src="js/views/SelectWorldModeView.js"></script>
<script src="js/views/SelectCorruptionView.js"></script>
<script src="js/views/EnterMapNameView.js"></script>
<script src="js/views/FinalizeWorldView.js"></script>
<script src="js/views/WorldCreationProgressView.js"></script>
<!-- 主应用逻辑 -->
<script src="js/main.js"></script>

</body>
</html>
